          - "Script de despliegue: rsync, reinstalación del unit, reinicio y comprobación HTTP que aborta si el servicio no responde"
          - "Servidor en Python de librería estándar, cero dependencias; frontend vanilla JS sin build"

      - name: "TFG — Gestor de academias ([#underline(offset: 1.3pt, stroke: 1.1pt)[github.com]](https://github.com/jfdg01/academy-management-app))"
