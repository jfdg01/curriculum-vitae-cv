      - label: Nube y despliegue
        details: "VPS en Oracle Cloud, Cloudflare Tunnel, despliegue automatizado con rsync + systemd y verificación de salud por HTTP"
      - label: Contenedores
        details: Docker, Kubernetes, AWS
      - label: Cómputo distribuido
        details: "Open MPI (C), Apache Spark (Scala)"
      - label: Edge-AI y GPU
