      - name: "Rebusca ([#underline(offset: 1.3pt, stroke: 1.1pt)[rebusca.dibogomez.com]](https://rebusca.dibogomez.com) · [#underline(offset: 1.3pt, stroke: 1.1pt)[github.com]](https://github.com/jfdg01/rebusca))"
