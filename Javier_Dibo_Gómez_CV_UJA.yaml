        Experiencia práctica administrando servidores Linux, desplegando servicios en la nube y ejecutando modelos de IA en hardware embarcado (NVIDIA Jetson)."

    Formación Académica:
      - institution: Universidad de Jaén
        area: Ingeniería Informática y Ciberseguridad
        degree: Doble Máster
