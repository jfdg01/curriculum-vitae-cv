    Projectos Destacados:
      - name: "Portfolio artístico ([#underline(offset: 1.3pt, stroke: 1.1pt)[cardenaspacheco.es]](https://cardenaspacheco.es) · [#underline(offset: 1.3pt, stroke: 1.1pt)[github.com]](https://github.com/jfdg01/art-porfolio-cardenas-pachecho))"
        date: 2025-08
        summary: "*Diseñé y desarrollé la web de presentación de obra de la artista Carmen Cárdenas Pacheco*"
        highlights:
          - Svelte 5, TypeScript, Vercel Edge
          - "Lighthouse 95+ en rendimiento sirviendo un catálogo de imágenes de obra originales de 5 MB+ cada una"
          - Optimización de assets, carga diferida y multiidioma para SEO

      - name: "Rebusca ([#underline(offset: 1.3pt, stroke: 1.1pt)[rebusca.dibogomez.com]](https://rebusca.dibogomez.com) · [#underline(offset: 1.3pt, stroke: 1.1pt)[github.com]](https://github.com/jfdg01/wallapop-scraper))"
        summary: "*Cazador de chollos de Wallapop: define búsquedas y te avisa de las mejores ofertas nuevas*"
        highlights:
          - "Frontend HTML/CSS/JavaScript vanilla, sin build: repo < 2 MB y carga en < 1 s"
          - Backend en Python stdlib puro, cero dependencias
          - En producción en un VPS vía Cloudflare Tunnel

      - name: "TFG — Gestor de academias ([#underline(offset: 1.3pt, stroke: 1.1pt)[github.com]](https://github.com/jfdg01/academy-management-app))"
        summary: "*Plataforma full-stack de gestión de academia: matrícula, calificaciones y pagos*"
        highlights:
          - Frontend web en SvelteKit; backend Java 21 + Spring Boot 3.5
          - Gestión de 1000 usuarios concurrentes
          - PostgreSQL, control de acceso por roles y pagos con Stripe

      - name: "Lumina ([#underline(offset: 1.3pt, stroke: 1.1pt)[github.com]](https://github.com/jfdg01/lumina-mobile))"
        summary: "*App que convierte una tablet en una caja de luz digital para artistas*"
        highlights:
          - React Native
          - "100% local, código abierto"

      - name: "TFM — Un dron que pilotas hablándole ([#underline(offset: 1.3pt, stroke: 1.1pt)[github.com]](https://github.com/jfdg01/jetson))"
        summary: "*Edge-AI: das una orden en lenguaje natural y el dron detecta, sigue y encuadra el objetivo, todo en el dispositivo*"
        highlights:
          - Qwen2-VL-2B afinado y cuantizado (1.65 GB) sobre Jetson Orin Nano a 15 W, sin nube
          - "62% de grounding on-device y 85% de seguimiento sostenido pese a movimiento y oclusión"

    Experiencia Empresarial:
      - company: Tienda de alimentación familiar "Los Argentinos"
        position: Dependiente a tiempo parcial.
        date:
        start_date: 2019-07
        end_date: present
        location: Jaén, España
        summary: "Desde el inicio de mi etapa universitaria, he compatibilizado mis estudios con el trabajo en el negocio familiar"
        highlights:
          - "Amplia experiencia en atención al cliente y trato personal cercano"
          - "Gestión de conflictos y problemas, responsabilidad financiera, capacidad de organización"
    Idiomas:
      - label: Español
        details: Nativo
      - label: Inglés
        details: Cambridge C1
      - label: Francés
        details: DELF B2
    
    Competencias Técnicas:
      - label: Web
        details: HTML, CSS, JavaScript, GSAP, Svelte 5, SvelteKit, React
      - label: Lenguajes
        details: TypeScript, Java, Python, C++
      - label: Backend
        details: Spring Boot, PostgreSQL
      - label: Control de versiones
        details: "Dominio total de Git y GitHub (¡échale un ojo a [#underline(offset: 1.3pt, stroke: 1.1pt)[mi GitHub]](https://github.com/jfdg01)!)"
      - label: Infra
        details: Docker, Kubernetes, AWS
    
    Otras Competencias Relevantes:
      - name: "Practicante de Artes Marciales"
        summary: Cinturón azul en Kung Fu. Mi entrenamiento me proporciona disciplina, concentración y autocompresión
        start_date: 2023
        end_date: present
      - name: Habilidades Comunicativas
        summary: 'Ponente en una charla de Google GDC titulada: "Cómo introducirse a la ciberseguridad" ante 70 personas'
        date: 2026-02
      - name: "Ritmo de trabajo"
        summary: "¡Trabajo rápido! Itero y entrego sin sacrificar calidad: monté una landing demo de Spider-Man: Brand New Day con GSAP en un solo día"
    
